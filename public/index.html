<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="form.css">
    <script src="script.js" defer></script>
    <title>Spotify</title>
</head>

<body>
    <div class="campoSite">
        <div class="CampoControle">
            <div class="capaMusica" id="CapaMusicaSelecionada">
                <img src="imagens/semiMAGEM.webp" alt="capaMusica">
            </div>

            <div class="controleAudio">
                <div class="informacoes">
                    <h3 id="nomeMusicaSelecionada">Nome da musica</h3>
                    <span id="NomeArtistaSelecionado">Nome do artista</span>
                </div>
                <div class="controls">
                    <button id="btn-play" onclick="execultandoAudio()"><img src="imagens/playIcon.png" alt="icon"
                            style="width: 24px; height: auto;"></button>
                    <div class="input">
                        <span id="tempoMusica">00:00</span>
                        <input type="range" id="TempoAtualMusica">
                    </div>
                </div>
                <span style="font-size: 12px; color: rgb(182, 21, 21); font-weight: 800; margin-bottom: 5px;">Aviso: Se
                    você selecionar outra musica enquanto outra roda, clique no botão mais de uma vez que vai.</span>
                <span style="font-size: 12px; color: rgb(182, 21, 21); font-weight: 800; margin-bottom: 5px;">Isso é um
                    bug que estou com preguiça de resolver.</span>
            </div>
        </div>
        <div class="titulo">
            <h2>Selecione uma musica</h2>
        </div>

        <div class="MusicasContainer">
        </div>
    </div>
    <div class="divCadastro">
        <details>
            <summary>Cadastrar música</summary>
            <form id="formCadastro">
                <div class="titulo">
                    <h2>Cadastar musica</h2>
                </div>
                <div class="inputs">
                    <input type="text" id="nomeMusica" placeholder="Nome da musica">
                    <input type="text" id="nomeArtista" placeholder="Nome do artista ou banda">
                    <label for="capaMusica">Capa da musica</label>
                    <input type="file" id="arquivoImagem" id="capaMusica" accept="image/*">
                    <label for="audio">Arquivo da musica</label>
                    <input type="file" id="arquivoAudio" id="audio" accept="audio/mpeg, audio/mp3, .mp3">
                </div>
                <div class="botoes">
                    <button>Cadastrar</button>
                </div>
            </form>
        </details>
    </div>
</body>

</html>
